<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OXYN FITNESS — CoachKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase SDK is loaded dynamically (with a timeout fallback) from the main script below,
     instead of blocking <script> tags here, so the page always renders even on a slow/blocked network. -->
<style>
:root {
  /* Night #000F08 / Imperial Red #FB3640 */
  --black:#000000; --surface:#0f0f0f; --surface-2:#181818; --surface-3:#222222;
  --border:rgba(255,255,255,0.07); --border-med:rgba(255,255,255,0.14);
  --tx:#ffffff; --tm:#888888; --th:#3a3a3a;
  --orange:#FB3640; --orange-dim:rgba(251,54,64,0.12); --orange-border:rgba(251,54,64,0.35); --orange-glow:rgba(251,54,64,0.25);
  --gn:#ffffff; --gnd:rgba(255,255,255,0.07); --rd:#FB3640; --rdd:rgba(251,54,64,0.12);
  --r:2px; --rl:4px;
  --fd:'Orbitron',sans-serif; --fb:'Barlow Condensed',sans-serif; --fm:'Barlow Condensed',sans-serif;
}
/* LIGHT MODE — white + red */
body.light{
  --black:#ffffff; --surface:#f5f5f5; --surface-2:#ebebeb; --surface-3:#dedede;
  --border:rgba(0,0,0,0.07); --border-med:rgba(0,0,0,0.13);
  --tx:#0a0a0a; --tm:#666666; --th:#aaaaaa;
  --orange:#FB3640; --orange-dim:rgba(251,54,64,0.08); --orange-border:rgba(251,54,64,0.3); --orange-glow:rgba(251,54,64,0.15);
  --gnd:rgba(0,0,0,0.04); --rdd:rgba(251,54,64,0.08);
}
body.light .hdr{background:rgba(255,255,255,0.95);}
body.light .cci.act{background:#0a0a0a;color:#ffffff;border-color:#0a0a0a;}
body.light .dt.act{background:#0a0a0a;color:#ffffff;border-color:#0a0a0a;}
body.light .bp{background:#0a0a0a;color:#ffffff;}
body.light .bp:hover{background:#222;}
body.light .wk-start-btn{background:#0a0a0a;color:#ffffff;}
body.light .wk-start-btn:hover{background:#222;}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--fb);background:var(--black);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}

/* LOGO */
.logo-main{fill:#f0ede8;transition:fill .2s;}
.logo-x{fill:#FB3640;}
body.light .logo-main{fill:#0a0a0a;}

/* THEME TOGGLE */
.theme-toggle{width:36px;height:20px;background:var(--surface-3);border:1px solid var(--border-med);border-radius:10px;cursor:pointer;position:relative;transition:all .2s;flex-shrink:0;}
.theme-toggle::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--orange);transition:transform .2s,background .2s;box-shadow:0 0 6px var(--orange-glow);}
body.light .theme-toggle::after{transform:translateX(16px);}
.theme-toggle-wrap{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.theme-lbl{font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--tm);text-transform:uppercase;user-select:none;}

/* DRAG AND DROP */
.er.drag-over{background:var(--orange-dim);border-top:2px solid var(--orange);}
.er.dragging{opacity:0.35;background:var(--surface-3);}
.drag-handle{cursor:grab;color:var(--th);font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 8px;height:100%;user-select:none;transition:color .15s;}
.drag-handle:hover{color:var(--orange);}
.drag-handle:active{cursor:grabbing;}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;padding:0 24px;gap:16px;}
.logo{display:flex;align-items:center;gap:0;cursor:pointer;flex-shrink:0;}
.bc{flex:1;display:flex;align-items:center;gap:6px;font-family:var(--fm);font-size:11px;color:var(--tm);overflow:hidden;}
.bcl{cursor:pointer;color:var(--orange);font-weight:700;}.bcl:hover{opacity:.7;}
.bcs{opacity:.3;}.bcc{color:var(--tx);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ha{display:flex;gap:8px;flex-shrink:0;align-items:center;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-family:var(--fm);font-size:11px;font-weight:700;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;}
.bp{background:var(--orange);color:#fff;box-shadow:none;}.bp:hover{background:#d92030;transform:translateY(-1px);}
body.light .bp{background:#FB3640;color:#ffffff;}
body.light .bp:hover{background:#d92030;}
.bg{background:transparent;color:var(--tm);border:1px solid var(--border-med);}.bg:hover{color:var(--tx);background:var(--surface-2);}
.bd{background:var(--rdd);color:var(--rd);border:1px solid transparent;}.bd:hover{border-color:var(--rd);}
.bg-green{background:var(--gnd);color:var(--gn);border:1px solid rgba(16,185,129,0.2);}.bg-green:hover{border-color:var(--gn);}
.bsm{padding:5px 12px;font-size:10px;}
.bi{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--tm);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:13px;font-family:var(--fb);transition:all .15s;}
.bi:hover{color:var(--tx);border-color:var(--border-med);background:var(--surface-2);}
.bi.dr:hover{color:var(--rd);border-color:var(--rd);background:var(--rdd);}
.bi.ed:hover{color:var(--orange);border-color:var(--orange);background:var(--orange-dim);}

/* LAYOUT */
.main{padding:28px 32px;max-width:1200px;margin:0 auto;}
.pg-hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
.pg-title{font-family:var(--fd);font-size:48px;letter-spacing:.04em;line-height:.95;}
.pg-title span{color:var(--orange);}
.pg-sub{font-size:12px;color:var(--tm);margin-top:4px;font-family:var(--fm);letter-spacing:.04em;}

/* SECTION LABEL */
.sec-label{font-family:var(--fm);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.sec-label::before{content:'';display:block;width:24px;height:1px;background:var(--orange);}

/* CLIENT GRID */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px;}
.cc{background:var(--surface);border:1px solid var(--border);padding:24px 20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.cc::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--orange);transform:scaleX(0);transition:transform .3s;transform-origin:left;}
.cc:hover{background:var(--surface-2);}.cc:hover::before{transform:scaleX(1);}
.cav{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:18px;margin-bottom:14px;}
.cn{font-family:var(--fd);font-size:24px;letter-spacing:.04em;margin-bottom:6px;}
.cgl{font-size:9px;font-weight:700;padding:2px 8px;border-radius:2px;display:inline-block;margin-bottom:10px;font-family:var(--fm);letter-spacing:.08em;text-transform:uppercase;}
.cm{font-size:11px;color:var(--tm);font-family:var(--fm);}
.add-card{background:var(--surface);border:1px dashed var(--orange-border);padding:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:160px;transition:all .2s;color:var(--tm);}
.add-card:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-dim);}
.add-card-plus{font-family:var(--fd);font-size:48px;line-height:1;color:var(--orange);}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);padding:20px;}

/* PROG LIST */
.pl{display:flex;flex-direction:column;gap:2px;}
.pc{background:var(--surface);border:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.pc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--orange);transform:scaleY(0);transition:transform .2s;transform-origin:bottom;}
.pc:hover{background:var(--surface-2);}.pc:hover::before{transform:scaleY(1);}
.pi{width:42px;height:42px;background:var(--orange-dim);border:1px solid var(--orange-border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.pt2{font-family:var(--fd);font-size:22px;letter-spacing:.04em;}
.pm{font-size:11px;color:var(--tm);margin-top:2px;font-family:var(--fm);}
.pa{display:flex;gap:5px;margin-left:auto;flex-shrink:0;opacity:0;transition:opacity .15s;}
.pc:hover .pa{opacity:1;}

/* BUILDER */
.bl{display:grid;grid-template-columns:1fr 290px;gap:20px;align-items:start;}
.bm{background:var(--surface);border:1px solid var(--border);padding:20px;margin-bottom:14px;}
.mg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px;}
.dts{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.dt{padding:6px 14px;font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px solid var(--border-med);background:transparent;color:var(--tm);transition:all .15s;}
.dt.act{background:var(--orange);color:#fff;border-color:var(--orange);box-shadow:none;}
body.light .dt.act{background:#FB3640;color:#ffffff;border-color:#FB3640;}
.dt:not(.act):hover{border-color:var(--tx);color:var(--tx);}
.dt-add{padding:6px 12px;font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px dashed var(--border-med);background:transparent;color:var(--tm);transition:all .15s;}
.dt-add:hover{border-color:var(--tx);color:var(--tx);background:var(--orange-dim);}

/* SESSION */
.sc{background:var(--surface);border:1px solid var(--border);overflow:hidden;}
.sh{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface-2);}
.sni{background:transparent;border:none;outline:none;font-family:var(--fd);font-size:20px;letter-spacing:.04em;color:var(--tx);flex:1;min-width:0;}
.er{display:grid;grid-template-columns:28px 1fr 54px 76px 76px 60px;border-bottom:1px solid var(--border);align-items:center;transition:background .1s;}
.er:last-child{border-bottom:none;}.er:hover{background:var(--orange-dim);}
.ec{padding:10px 12px;font-size:12px;}
.eh{padding:7px 12px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--th);background:var(--surface-2);border-bottom:1px solid var(--border);font-family:var(--fm);}
.enm{font-weight:500;}
.cb{font-size:8px;font-weight:700;padding:2px 6px;border-radius:2px;display:inline-block;margin-left:5px;vertical-align:middle;font-family:var(--fm);letter-spacing:.06em;text-transform:uppercase;}
.ei{background:transparent;border:1px solid transparent;outline:none;font-family:var(--fm);font-size:11px;color:var(--tx);width:100%;text-align:center;padding:3px;transition:all .15s;}
.ei:hover{border-color:var(--border-med);background:var(--surface-2);}
.ei:focus{background:var(--surface-2);border-color:var(--border-med);}
.custom-badge{font-size:8px;font-weight:700;padding:1px 5px;background:var(--gnd);color:var(--gn);border:1px solid rgba(16,185,129,0.2);display:inline-block;margin-left:4px;vertical-align:middle;font-family:var(--fm);}

/* LIBRARY */
.lp{background:var(--surface);border:1px solid var(--border);position:sticky;top:74px;max-height:calc(100vh - 90px);overflow:hidden;display:flex;flex-direction:column;}
.lh{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);}
.lt{font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--tm);margin-bottom:10px;}
.ls{width:100%;background:var(--black);border:1px solid var(--border-med);padding:8px 12px;font-family:var(--fb);font-size:13px;color:var(--tx);outline:none;margin-bottom:10px;transition:border-color .15s;}
.ls:focus{border-color:var(--border-med);}
.ls::placeholder{color:var(--th);}
.cf{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px;}
.cci{padding:2px 8px;font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--tm);transition:all .12s;}
.cci:hover{border-color:var(--tx);color:var(--tx);}
.cci.act{background:var(--orange);color:#fff;border-color:var(--orange);}
body.light .cci.act{background:#FB3640;color:#ffffff;border-color:#FB3640;}
.ll{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--border-med) transparent;}
.lib-section-hdr{padding:7px 14px;font-family:var(--fm);font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gn);background:var(--gnd);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.lib-section-hdr-default{padding:7px 14px;font-family:var(--fm);font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--th);background:var(--surface-2);border-bottom:1px solid var(--border);}
.li{display:flex;align-items:center;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;gap:8px;}
.li:last-child{border-bottom:none;}
.li:hover{background:var(--orange-dim);}
.li:hover .ladd{border-color:var(--orange);color:var(--orange);background:var(--orange-dim);}
.li-body{flex:1;min-width:0;}
.lnm{font-size:12px;font-weight:500;flex:1;}
.lmu{font-size:10px;color:var(--th);margin-top:1px;}
.ladd{width:22px;height:22px;border:1px solid var(--border-med);background:transparent;color:var(--tm);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all .12s;}
.li-acts{display:flex;gap:3px;opacity:0;transition:opacity .15s;flex-shrink:0;}
.li:hover .li-acts{opacity:1;}
.li-btn{width:20px;height:20px;border:none;background:transparent;color:var(--th);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .12s;}
.li-btn.edit:hover{color:var(--orange);}
.li-btn.del:hover{color:var(--rd);}

/* PROGRAM VIEW */
.pvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:2px;}
.pvd{background:var(--surface);border:1px solid var(--border);}
.pvdh{padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.pvdn{font-family:var(--fd);font-size:20px;letter-spacing:.04em;}
.pvds{font-size:10px;color:var(--tm);margin-top:1px;font-family:var(--fm);}
.pve{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.pve:last-child{border-bottom:none;}
.pven{font-size:13px;font-weight:500;flex:1;}
.pved{font-family:var(--fm);font-size:10px;color:var(--tm);text-align:right;}
.sc2{background:var(--orange-dim);border:1px solid var(--orange-border);padding:3px 10px;font-size:11px;color:var(--orange);display:inline-block;margin:2px 3px;font-family:var(--fm);font-weight:700;letter-spacing:.04em;}

/* FORM */
.fg{margin-bottom:14px;}
.fl{display:block;font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tm);margin-bottom:6px;}
.fi{width:100%;background:var(--surface-2);border:1px solid var(--border-med);padding:10px 12px;font-family:var(--fb);font-size:14px;color:var(--tx);outline:none;transition:all .15s;}
.fi:focus{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-dim);}
.fi::placeholder{color:var(--th);}
select.fi{appearance:none;-webkit-appearance:none;cursor:pointer;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fta{min-height:80px;resize:vertical;}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fi .15s ease;}
.md{background:var(--surface);border:1px solid var(--border-med);padding:28px;width:100%;max-width:480px;animation:su .2s ease;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.mdt{font-family:var(--fd);font-size:36px;letter-spacing:.04em;margin-bottom:20px;}
.mdf{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

/* MISC */
.sd{display:flex;align-items:center;gap:12px;margin:24px 0 16px;}
.sdt{font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--th);white-space:nowrap;}
.sdl{flex:1;height:1px;background:var(--border);}
.empty{text-align:center;padding:40px 24px;}
.ei2{font-family:var(--fd);font-size:48px;color:var(--orange);opacity:.3;margin-bottom:12px;}
.et2{font-family:var(--fd);font-size:28px;letter-spacing:.04em;margin-bottom:6px;}
.ed{font-size:13px;color:var(--tm);line-height:1.6;}
.dpb{padding:6px 14px;font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px solid var(--border-med);background:transparent;color:var(--tm);transition:all .15s;}
.dpb.pk{background:var(--orange-dim);color:var(--orange);border-color:var(--orange-border);}
.toast{position:fixed;bottom:24px;right:28px;background:var(--surface-2);border:1px solid var(--border-med);padding:12px 20px;font-size:13px;color:var(--tx);display:flex;align-items:center;gap:10px;z-index:300;animation:sir .2s ease;box-shadow:0 8px 32px rgba(0,0,0,.5);font-family:var(--fm);}

/* AUTOSAVE BADGE */
.autosave-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tm);padding:5px 10px;border-radius:var(--r);border:1px solid var(--border);white-space:nowrap;transition:all .2s;}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
.autosave-badge .as-dot{width:6px;height:6px;border-radius:50%;background:var(--th);flex-shrink:0;transition:all .2s;}
.autosave-badge.saving{color:var(--orange);border-color:var(--orange-border);background:var(--orange-dim);}
.autosave-badge.saving .as-dot{background:var(--orange);animation:aspulse 1s ease-in-out infinite;}
.autosave-badge.saved{color:var(--tx);border-color:var(--border-med);background:var(--gnd);}
.autosave-badge.saved .as-dot{background:var(--tx);}
@keyframes aspulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(0.7);}}
@keyframes sir{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* COLORS */
.av0{background:rgba(251,54,64,.15);color:#e8000d}.av1{background:rgba(16,185,129,.15);color:#10B981}
.av2{background:rgba(234,88,12,.15);color:#EA580C}.av3{background:rgba(248,113,113,.15);color:#F87171}
.av4{background:rgba(8,145,178,.15);color:#0891B2}.av5{background:rgba(167,139,250,.15);color:#A78BFA}
.gf{background:rgba(248,113,113,.12);color:#F87171}.gm{background:rgba(167,139,250,.12);color:#A78BFA}
.gs{background:rgba(251,54,64,.12);color:#e8000d}.ge{background:rgba(16,185,129,.12);color:#10B981}
.ggl{background:rgba(245,158,11,.12);color:#F59E0B}
.csq{background:rgba(167,139,250,.1);color:#A78BFA}.chi{background:rgba(16,185,129,.1);color:#10B981}
.cpu{background:rgba(251,54,64,.1);color:#e8000d}.cpl{background:rgba(248,113,113,.1);color:#F87171}
.cco{background:rgba(136,136,136,.1);color:#888}.cca{background:rgba(8,145,178,.1);color:#0891B2}
.cply{background:rgba(219,39,119,.1);color:#DB2777}.crot{background:rgba(202,138,4,.1);color:#CA8A04}
.cmob{background:rgba(16,185,129,.1);color:#10B981}.cpow{background:rgba(251,54,64,.1);color:#e8000d}
.cfn{background:rgba(136,136,136,.1);color:#888}.cst{background:rgba(16,185,129,.1);color:#10B981}
.cabd{background:rgba(245,158,11,.1);color:#F59E0B}.cadd{background:rgba(239,68,68,.1);color:#EF4444}
.clng{background:rgba(99,102,241,.1);color:#6366F1}.ccar{background:rgba(20,184,166,.1);color:#14B8A6}
.lv-b{background:rgba(16,185,129,.1);color:#10B981}.lv-i{background:rgba(251,54,64,.1);color:#e8000d}
.lv-a{background:rgba(248,113,113,.1);color:#F87171}

/* ── WORKOUT MODE ── */
.wk-wrap{max-width:680px;margin:0 auto;padding:28px 32px;}
.wk-header{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--orange);padding:20px 24px;margin-bottom:16px;}
.wk-title{font-family:var(--fd);font-size:36px;letter-spacing:.04em;margin-bottom:4px;}
.wk-subtitle{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tm);}
.wk-progress-wrap{margin:16px 0 0;}
.wk-progress-bar{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-bottom:6px;}
.wk-progress-fill{height:100%;background:var(--orange);border-radius:2px;transition:width .4s ease;box-shadow:0 0 8px var(--orange-glow);}
.wk-progress-label{font-family:var(--fm);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);display:flex;justify-content:space-between;}
.wk-progress-label span{color:var(--orange);}
.wk-ex-list{display:flex;flex-direction:column;gap:2px;margin-bottom:16px;}
.wk-ex{background:var(--surface);border:1px solid var(--border);padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.wk-ex:active{transform:scale(.99);}
.wk-ex.done{background:rgba(251,54,64,0.05);border-color:var(--orange-border);}
.wk-ex.done .wk-ex-name{text-decoration:line-through;color:var(--tm);}
.wk-ex.done .wk-ex-detail{color:var(--th);}
.wk-check{width:28px;height:28px;border:2px solid var(--border-med);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:14px;}
.wk-ex.done .wk-check{background:var(--orange);border-color:var(--orange);color:#000;font-weight:700;box-shadow:0 0 10px var(--orange-glow);}
.wk-ex-info{flex:1;min-width:0;}
.wk-ex-name{font-size:14px;font-weight:500;margin-bottom:4px;transition:all .2s;}
.wk-ex-detail{font-family:var(--fm);font-size:10px;letter-spacing:.06em;color:var(--orange);display:flex;gap:14px;flex-wrap:wrap;}
.wk-ex-detail span{color:var(--tm);}
.wk-ex-num{font-family:var(--fd);font-size:28px;color:var(--th);letter-spacing:.04em;flex-shrink:0;transition:color .2s;}
.wk-ex.done .wk-ex-num{color:var(--orange);}
/* Rest timer */
.wk-timer{background:var(--surface);border:1px solid var(--orange-border);padding:16px 20px;margin-bottom:16px;display:none;align-items:center;gap:14px;}
.wk-timer.active{display:flex;}
.wk-timer-icon{font-size:22px;animation:pulse 1s infinite;}
.wk-timer-label{font-family:var(--fm);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:2px;}
.wk-timer-val{font-family:var(--fd);font-size:32px;letter-spacing:.04em;color:var(--orange);line-height:1;}
.wk-timer-skip{margin-left:auto;font-family:var(--fm);font-size:9px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid var(--border-med);color:var(--tm);padding:5px 10px;cursor:pointer;transition:all .15s;}
.wk-timer-skip:hover{border-color:var(--orange);color:var(--orange);}
/* Completion screen */
.wk-done{text-align:center;padding:60px 24px;}
.wk-done-icon{font-size:72px;margin-bottom:20px;animation:float 2s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.wk-done-title{font-family:var(--fd);font-size:56px;letter-spacing:.04em;margin-bottom:8px;color:var(--orange);}
.wk-done-sub{font-family:var(--fm);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tm);margin-bottom:32px;}
.wk-done-stats{display:flex;gap:2px;margin-bottom:32px;justify-content:center;}
.wk-done-stat{background:var(--surface);border:1px solid var(--border);padding:20px 28px;text-align:center;}
.wk-done-stat-num{font-family:var(--fd);font-size:40px;color:var(--orange);line-height:1;margin-bottom:4px;}
.wk-done-stat-label{font-family:var(--fm);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);}
/* Start workout button on session cards */
.wk-start-btn{font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--orange);color:#fff;border:none;padding:5px 12px;cursor:pointer;transition:all .15s;margin-left:8px;box-shadow:none;}
.wk-start-btn:hover{background:#b8181d;}
body.light .wk-start-btn{background:#FB3640;color:#ffffff;}
body.light .wk-start-btn:hover{background:#b8181d;}

@media(max-width:768px){.bl{grid-template-columns:1fr;}.lp{position:static;max-height:360px;}.main{padding:16px;}.mg{grid-template-columns:1fr 1fr;}.pvg{grid-template-columns:1fr;}.pg-hdr{flex-direction:column;align-items:flex-start;}.wk-wrap{padding:16px;}.wk-done-stats{flex-direction:column;}}
@media(max-width:480px){.cg{grid-template-columns:1fr 1fr;}.mg{grid-template-columns:1fr;}.fr{grid-template-columns:1fr;}}

/* ── DASHBOARD ── */
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.stat-box{background:var(--surface);border:1px solid var(--border);padding:26px 24px;}
.stat-box-label{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tm);margin-bottom:12px;}
.stat-box-val{font-family:var(--fd);font-size:52px;color:var(--orange);line-height:1;}
.dash-table-wrap{background:var(--surface);border:1px solid var(--border);overflow:hidden;}
.dash-table-hdr{padding:18px 24px 16px;border-bottom:1px solid var(--border);}
.dash-table-title{font-size:17px;font-weight:700;font-family:var(--fb);}
.dtable{width:100%;border-collapse:collapse;}
.dtable th{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);font-weight:700;padding:13px 24px;text-align:left;border-bottom:1px solid var(--border);background:var(--surface-2);}
.dtable td{padding:15px 24px;font-size:14px;border-bottom:1px solid var(--border);}
.dtable tr:last-child td{border-bottom:none;}
.dtable tr:hover td{background:var(--orange-dim);}
.sbadge{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:20px;font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.04em;}
.sb-ok{background:rgba(34,197,94,0.15);color:#22c55e;}
.sb-ip{background:rgba(251,54,64,0.15);color:#FB3640;}
.sb-ms{background:rgba(136,136,136,0.15);color:#888;}
/* TOP NAV */
.tnav{display:flex;gap:2px;flex:1;justify-content:center;}
.tnav-a{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tm);padding:7px 18px;cursor:pointer;transition:color .15s;background:none;border:none;}
.tnav-a:hover{color:var(--tx);}
.tnav-a.act{color:var(--orange);}
/* SIDEBAR */
.app-wrap{display:flex;min-height:calc(100vh - 58px);}
.sidebar{width:230px;background:var(--surface);border-right:1px solid var(--border);padding:12px 0;flex-shrink:0;}
.sbi{display:flex;align-items:center;gap:10px;padding:12px 22px;font-family:var(--fm);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tm);cursor:pointer;transition:all .15s;border-left:3px solid transparent;}
.sbi:hover{color:var(--tx);background:rgba(255,255,255,0.03);}
.sbi.act{color:var(--orange);background:rgba(251,54,64,0.08);border-left-color:var(--orange);}
.page-body{flex:1;overflow:auto;}
@media(max-width:900px){.dash-stats{grid-template-columns:1fr 1fr;}}
@media(max-width:768px){.sidebar{display:none;}.dash-stats{grid-template-columns:1fr 1fr;}}
@media(max-width:480px){.dash-stats{grid-template-columns:1fr;}}

/* GROUPING */
.grp-lbl{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;font-size:10px;font-weight:700;flex-shrink:0;margin-right:5px;}
.gl-ss{background:#FB3640;color:#fff;}.gl-tri{background:#e67e22;color:#fff;}.gl-cir{background:#8e44ad;color:#fff;}
.gl-ds{background:#0ea5e9;color:#fff;}.gl-pyr{background:#f59e0b;color:#000;}.gl-rp{background:#10b981;color:#fff;}
.gl-phr{background:#a855f7;color:#fff;}
.sys-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:9px;font-weight:700;letter-spacing:.08em;border-radius:2px;font-family:var(--fm);}

/* RPE COLUMN */
.er{grid-template-columns:28px 1fr 54px 76px 76px 60px 54px!important;}
.rpe-pill{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.04em;font-family:var(--fm);}
.rpe-easy{background:rgba(16,185,129,.15);color:#10b981;}
.rpe-mod{background:rgba(251,191,36,.15);color:#f59e0b;}
.rpe-hard{background:rgba(251,54,64,.15);color:#FB3640;}

/* TEMPLATES */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:18px;}
.tpl-card{background:var(--surface);border:1px solid var(--border);padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.tpl-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--orange);transform:scaleX(0);transition:transform .3s;transform-origin:left;}
.tpl-card:hover{background:var(--surface-2);border-color:var(--orange-border);}.tpl-card:hover::before{transform:scaleX(1);}
.tpl-icon{font-size:28px;margin-bottom:10px;}
.tpl-name{font-family:var(--fd);font-size:18px;letter-spacing:.04em;margin-bottom:4px;}
.tpl-meta{font-size:10px;color:var(--tm);font-family:var(--fm);letter-spacing:.04em;margin-bottom:10px;}
.tpl-tags{display:flex;flex-wrap:wrap;gap:4px;}
.tpl-tag{font-size:9px;font-weight:700;padding:2px 7px;background:var(--orange-dim);color:var(--orange);border:1px solid var(--orange-border);font-family:var(--fm);letter-spacing:.04em;}

/* PROGRESS TRACKING */
.prog-log{background:var(--surface);border:1px solid var(--border);padding:18px 20px;margin-bottom:10px;}
.prog-log-date{font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);margin-bottom:6px;}
.prog-log-row{display:flex;align-items:center;gap:10px;font-size:12px;}
.progress-chart{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:10px;}
.progress-bar-v{background:var(--orange-dim);border:1px solid var(--orange-border);flex:1;min-width:10px;transition:height .4s;position:relative;cursor:default;}
.progress-bar-v:hover{background:var(--orange-glow);}
.progress-bar-v .pb-tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--border-med);padding:3px 8px;font-size:9px;font-family:var(--fm);white-space:nowrap;color:var(--tx);pointer-events:none;display:none;z-index:10;}
.progress-bar-v:hover .pb-tip{display:block;}

/* AUTH SCREENS */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black);padding:20px;}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border-med);padding:36px 32px;}
.auth-logo{display:flex;justify-content:center;margin-bottom:24px;}
.auth-tabs{display:flex;border:1px solid var(--border-med);margin-bottom:24px;}
.auth-tab{flex:1;text-align:center;padding:10px;font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tm);cursor:pointer;transition:all .15s;}
.auth-tab.act{background:var(--orange);color:#fff;}
.auth-err{background:var(--orange-dim);border:1px solid var(--orange-border);color:var(--orange);font-size:12px;padding:10px 12px;margin-bottom:14px;font-family:var(--fb);}
.auth-msg{background:var(--gnd);border:1px solid var(--border-med);color:var(--tx);font-size:12px;padding:10px 12px;margin-bottom:14px;font-family:var(--fb);}
.auth-switch{text-align:center;margin-top:16px;font-size:12px;color:var(--tm);font-family:var(--fb);}
.auth-switch a{color:var(--orange);cursor:pointer;text-decoration:underline;}
.auth-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--tm);font-family:var(--fm);letter-spacing:.1em;text-transform:uppercase;font-size:12px;}
.setup-banner{background:var(--orange-dim);border:1px solid var(--orange-border);color:var(--tx);padding:20px 24px;max-width:520px;font-family:var(--fb);font-size:13px;line-height:1.7;margin:0 auto;}
.setup-banner code{background:var(--surface-3);padding:1px 6px;border-radius:2px;font-family:monospace;font-size:12px;}
.invite-link-box{background:var(--surface-2);border:1px solid var(--border-med);padding:10px 12px;font-family:monospace;font-size:12px;word-break:break-all;color:var(--tx);margin:10px 0;}
.portal-hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;}
</style>

<script>
/* ══════════════════════════════════════════════════════════════
   FIREBASE SETUP — paste your config from the Firebase console
   (Project settings → General → Your apps → Web app) below.
   ══════════════════════════════════════════════════════════════ */
const firebaseConfig={
  apiKey:"AIzaSyD3SHRgHM4eZTybnF5uF-V4R40DBbldDqo",
  authDomain:"oxyn-coachkit.firebaseapp.com",
  projectId:"oxyn-coachkit",
  storageBucket:"oxyn-coachkit.firebasestorage.app",
  messagingSenderId:"649488137728",
  appId:"1:649488137728:web:35f805ed558d35f618a2e5"
};
const FB_CONFIGURED=firebaseConfig.apiKey!=='PASTE_YOUR_API_KEY'&&!!firebaseConfig.apiKey;
let fbApp=null,fbAuth=null,fbDb=null;

/* AUTH state — separate from S (which holds the working data set) */
const AUTH={status:'loading',uid:null,role:null,coachUid:null,clientId:null,name:null,authTab:'login',err:'',msg:''};
let _stateUnsub=null,_submittedLogsUnsub=null,_fsSaveTimer=null;

/* Load the Firebase SDK asynchronously (never blocks initial page render) with a timeout fallback */
function loadScriptTag(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('Failed to load '+src));
    document.head.appendChild(s);
  });
}
function loadFirebaseSDK(onReady,onFail){
  const urls=[
    'https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js'
  ];
  let settled=false;
  const timer=setTimeout(()=>{if(!settled){settled=true;onFail();}},7000);
  urls.reduce((p,url)=>p.then(()=>loadScriptTag(url)),Promise.resolve())
    .then(()=>{
      if(settled)return;
      settled=true;clearTimeout(timer);
      fbApp=firebase.initializeApp(firebaseConfig);
      fbAuth=firebase.auth();
      fbDb=firebase.firestore();
      onReady();
    })
    .catch(()=>{
      if(settled)return;
      settled=true;clearTimeout(timer);
      onFail();
    });
}

function qs(name){const m=new URLSearchParams(location.search);return m.get(name);}
window.addEventListener('error',function(e){
  var app=document.getElementById('app');
  if(app)app.innerHTML='<div class="auth-wrap"><div class="setup-banner"><div style="font-family:var(--fd);font-size:15px;margin-bottom:12px;color:var(--orange)">SOMETHING WENT WRONG</div>An error occurred while loading this page. Screenshot this and send it over:<div class="invite-link-box">'+es(e.message||'Unknown error')+(e.error&&e.error.stack?'\n\n'+es(String(e.error.stack).slice(0,600)):'')+'</div><button class="btn bp" onclick="location.reload()">Reload</button></div></div>';
});

/* ── AUTH SCREENS ── */
function vAuthLoading(){return'<div class="auth-loading">Loading…</div>';}
function vSdkError(){
  return'<div class="auth-wrap"><div class="setup-banner"><div style="font-family:var(--fd);font-size:15px;margin-bottom:12px;color:var(--orange)">CONNECTION PROBLEM</div>'
  +'Could not load the cloud sync library. Check your internet connection, disable any ad-blocker for this page, and reload.'
  +'<div style="margin-top:16px"><button class="btn bp" onclick="location.reload()">Reload</button></div></div></div>';
}
function vSetupBanner(){
  return'<div class="auth-wrap"><div class="setup-banner"><div style="font-family:var(--fd);font-size:15px;margin-bottom:12px;color:var(--orange)">CLOUD SYNC NOT CONFIGURED</div>'
  +'This app is wired for Firebase but no project config has been added yet. Open this HTML file, find <code>firebaseConfig</code> near the top of the script, and paste in your Firebase project\'s web config. Until then the app runs in local-only mode.'
  +'<div style="margin-top:16px"><button class="btn bp" onclick="AUTH.status=\'localonly\';boot()">Continue in local-only mode</button></div></div></div>';
}
function vAuthLogin(){
  const isSignup=AUTH.authTab==='signup';
  return'<div class="auth-wrap"><div class="auth-card">'
    +'<div class="auth-logo"><span style="font-family:var(--fd);font-size:22px;font-weight:900;letter-spacing:.05em">O<span style="color:var(--orange)">X</span>YN</span></div>'
    +'<div class="auth-tabs"><div class="auth-tab'+(!isSignup?' act':'')+'" onclick="AUTH.authTab=\'login\';AUTH.err=\'\';render()">Log In</div><div class="auth-tab'+(isSignup?' act':'')+'" onclick="AUTH.authTab=\'signup\';AUTH.err=\'\';render()">Coach Sign Up</div></div>'
    +(AUTH.err?'<div class="auth-err">'+es(AUTH.err)+'</div>':'')
    +(AUTH.msg?'<div class="auth-msg">'+es(AUTH.msg)+'</div>':'')
    +(isSignup?'<div class="fg"><label class="fl">Your name</label><input class="fi" id="au-name" placeholder="Coach name"></div>':'')
    +'<div class="fg"><label class="fl">Email</label><input class="fi" id="au-email" type="email" placeholder="you@example.com"></div>'
    +'<div class="fg"><label class="fl">Password</label><input class="fi" id="au-pass" type="password" placeholder="••••••••"></div>'
    +'<button class="btn bp" style="width:100%;margin-top:8px" onclick="'+(isSignup?'doCoachSignup()':'doLogin()')+'">'+(isSignup?'Create Coach Account':'Log In')+'</button>'
    +'<div class="auth-switch">Client with an invite link? Just open the link your coach sent you.</div>'
    +'</div></div>';
}
function vInviteRedeem(){
  return'<div class="auth-wrap"><div class="auth-card">'
    +'<div class="auth-logo"><span style="font-family:var(--fd);font-size:22px;font-weight:900;letter-spacing:.05em">O<span style="color:var(--orange)">X</span>YN</span></div>'
    +'<div class="sec-label" style="text-align:center;margin-bottom:6px">Client Invite</div>'
    +'<div class="pg-title" style="text-align:center;font-size:18px;margin-bottom:20px">'+es(AUTH._inviteClientName||'Set Up Your Account')+'</div>'
    +(AUTH.err?'<div class="auth-err">'+es(AUTH.err)+'</div>':'')
    +'<div class="fg"><label class="fl">Email</label><input class="fi" id="au-email" type="email" value="'+es(AUTH._inviteEmail||'')+'"></div>'
    +'<div class="fg"><label class="fl">Choose a password</label><input class="fi" id="au-pass" type="password" placeholder="At least 6 characters"></div>'
    +'<button class="btn bp" style="width:100%;margin-top:8px" onclick="doInviteRedeem()">Create My Account</button>'
    +'</div></div>';
}
function doLogin(){
  const email=document.getElementById('au-email').value.trim(),pass=document.getElementById('au-pass').value;
  if(!email||!pass){AUTH.err='Enter your email and password.';render();return;}
  AUTH.err='';AUTH.msg='';
  fbAuth.signInWithEmailAndPassword(email,pass).catch(e=>{AUTH.err=fbErrMsg(e);render();});
}
function doCoachSignup(){
  const name=document.getElementById('au-name').value.trim(),email=document.getElementById('au-email').value.trim(),pass=document.getElementById('au-pass').value;
  if(!name||!email||!pass){AUTH.err='Fill in all fields.';render();return;}
  if(pass.length<6){AUTH.err='Password must be at least 6 characters.';render();return;}

  }).catch(e=>{AUTH.err=fbErrMsg(e);render();});
}
function doInviteRedeem(){
  const email=document.getElementById('au-email').value.trim(),pass=document.getElementById('au-pass').value;
  if(!email||!pass){AUTH.err='Fill in all fields.';render();return;}
  if(pass.length<6){AUTH.err='Password must be at least 6 characters.';render();return;}
  const code=AUTH._inviteCode;
  AUTH.err='';
  fbDb.collection('invites').doc(code).get().then(snap=>{
    if(!snap.exists||snap.data().used)throw new Error('This invite link is no longer valid.');
    const inv=snap.data();
    return fbAuth.createUserWithEmailAndPassword(email,pass).then(cred=>{
      const uid=cred.user.uid;
      return Promise.all([
        fbDb.collection('users').doc(uid).set({role:'client',coachUid:inv.coachUid,clientId:inv.clientId,name:inv.clientName,email,created:Date.now()}),
        fbDb.collection('invites').doc(code).update({used:true,usedBy:uid}),
        fbDb.collection('coaches').doc(inv.coachUid).collection('clientPortal').doc(inv.clientId).set({authUid:uid},{merge:true})
      ]);
    });
  }).catch(e=>{AUTH.err=fbErrMsg(e);render();});
}
function fbErrMsg(e){
  const c=e&&e.code||'';
  if(c==='auth/email-already-in-use')return'That email is already registered — try logging in instead.';
  if(c==='auth/invalid-email')return'That email address looks invalid.';
  if(c==='auth/weak-password')return'Password must be at least 6 characters.';
  if(c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-credential')return'Incorrect email or password.';
  return e&&e.message||'Something went wrong. Please try again.';
}
function logoutFB(){
  if(_stateUnsub){_stateUnsub();_stateUnsub=null;}
  if(_submittedLogsUnsub){_submittedLogsUnsub();_submittedLogsUnsub=null;}
  fbAuth.signOut();
}

/* ── COACH: FIRESTORE STATE SYNC (single blob doc, mirrors localStorage shape) ── */
function fsLoadCoachState(uid){
  AUTH.status='loading';render();
  const ref=fbDb.collection('coaches').doc(uid).collection('state').doc('main');
  _stateUnsub=ref.onSnapshot(snap=>{
    const d=snap.data();
    if(d){S.cls=d.cls||[];S.progs=d.progs||{};S.customEx=d.customEx||[];S.progressLog=d.progressLog||{};}
    AUTH.status='coach';
    render();
  },err=>{AUTH.status='coach';AUTH.err='Sync error: '+err.message;render();});
  // merge in any client-submitted workout logs
  _submittedLogsUnsub=fbDb.collectionGroup('submittedLogs').where('coachUid','==',uid).onSnapshot(qsnap=>{
    if(qsnap.empty)return;
    qsnap.forEach(doc=>{
      const d=doc.data();
      const key=d.cid+'_'+d.pid;
      if(!S.progressLog[key])S.progressLog[key]=[];
      if(!S.progressLog[key].some(l=>l.subId===doc.id))S.progressLog[key].push(Object.assign({},d.log,{subId:doc.id}));
      doc.ref.delete();
    });
    fsSaveCoachState();
  },err=>{console.error('Client log sync error (may need a Firestore index):',err);});
}
function fsSaveCoachState(){
  if(!fbDb||!AUTH.uid||AUTH.role!=='coach')return;
  if(_fsSaveTimer)clearTimeout(_fsSaveTimer);
  _fsSaveTimer=setTimeout(()=>{
    fbDb.collection('coaches').doc(AUTH.uid).collection('state').doc('main').set({
      cls:S.cls,progs:S.progs,customEx:S.customEx,progressLog:S.progressLog,updatedAt:Date.now()
    }).then(()=>{
      // mirror each client's own program(s) + log into their restricted portal doc
      S.cls.forEach(c=>{
        const clProgs=(S.progs[c.id]||[]);
        const clLogs={};
        Object.keys(S.progressLog).forEach(function(k){if(k.indexOf(c.id+'_')===0)clLogs[k]=S.progressLog[k];});
        fbDb.collection('coaches').doc(AUTH.uid).collection('clientPortal').doc(c.id).set({
          clientName:c.name,programs:clProgs,progressLog:clLogs,coachUid:AUTH.uid,clientId:c.id
        },{merge:true});
      });
    }).catch(e=>console.error('Cloud save failed:',e));
  },600);
}

function vClientPortal(){
  if(S.v==='workout')return vWorkout();
  const portal=AUTH._portal||{programs:[],progressLog:{}};
  const progs=portal.programs||[];
  const logs=[];
  Object.keys(portal.progressLog||{}).forEach(function(k){(portal.progressLog[k]||[]).forEach(function(l){logs.push(l);});});
  logs.sort((a,b)=>b.date-a.date);
  const progCards=progs.length?progs.map(p=>{
    const sessBtns=(p.sessions||[]).map((s,si)=>'<button class="btn bp bsm" onclick="startClientWorkout(\''+p.id+'\','+si+')">▶ '+es(s.day)+(s.name&&s.name!=='Session'?' — '+es(s.name):'')+'</button>').join(' ');
    return'<div class="card" style="margin-bottom:16px"><div class="pt2" style="margin-bottom:10px">'+es(p.name).toUpperCase()+'</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+sessBtns+'</div></div>';
  }).join(''):'<div class="empty"><div class="ei2">📋</div><div class="et2">NO PROGRAM ASSIGNED YET</div><div class="ed">Your coach hasn\'t assigned you a program yet.</div></div>';
  const histRows=logs.slice(0,10).map(l=>{
    const dt=new Date(l.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    return'<tr><td style="padding:8px 12px;font-size:13px">'+es(dt)+'</td><td style="padding:8px 12px;font-size:12px;color:var(--tm)">'+es(l.sessName)+'</td><td style="padding:8px 12px;text-align:center;font-size:12px">'+l.pct+'%</td></tr>';
  }).join('');
  const histSec=logs.length?'<div class="sd" style="margin-top:24px"><span class="sdt">Your History</span><div class="sdl"></div></div><div class="dash-table-wrap"><table class="dtable"><thead><tr><th>Date</th><th>Session</th><th style="text-align:center">Completion</th></tr></thead><tbody>'+histRows+'</tbody></table></div>':'';
  return'<div><div class="portal-hdr"><div style="font-family:var(--fd);font-size:16px">Hi, '+es(AUTH.name||'')+'</div><button class="btn bg bsm" onclick="logoutFB()">Log Out</button></div><div class="main"><div class="sd"><span class="sdt">Your Programs</span><div class="sdl"></div></div>'+progCards+histSec+'</div></div>';
}
function startClientWorkout(pid,si){
  const portal=AUTH._portal||{programs:[]};
  const prog=(portal.programs||[]).find(p=>p.id===pid);
  if(!prog)return;
  S.ep=JSON.parse(JSON.stringify(prog));
  S.wk.si=si;S.wk.checked=[];S.wk.startTime=Date.now();S.wk.timerSecs=0;
  if(S.wk.timerInt)clearInterval(S.wk.timerInt);
  S.wk.timerInt=null;
  navTo('workout',{cid:AUTH.clientId,pid:pid});
}

/* ── BOOT ── */
function fetchUserDocWithRetry(uid,attempt){
  fbDb.collection('users').doc(uid).get().then(snap=>{
    const d=snap.data();
    if(!d){
      if(attempt<10){setTimeout(()=>fetchUserDocWithRetry(uid,attempt+1),300);return;}
      AUTH.status='login';AUTH.err='Account not fully set up. Please try again.';fbAuth.signOut();return;
    }
    AUTH.role=d.role;AUTH.name=d.name;
    if(d.role==='coach'){fsLoadCoachState(uid);}
    else{AUTH.coachUid=d.coachUid;AUTH.clientId=d.clientId;fsLoadClientPortal();}
  });
}
function boot(){
  if(!FB_CONFIGURED){AUTH.status='localonly';ld();applyTheme();render();return;}
  applyTheme();
  AUTH.status='loading';render();
  loadFirebaseSDK(bootAfterSDK,()=>{AUTH.status='sdkerror';render();});
}
function bootAfterSDK(){
  const invite=qs('invite');
  fbAuth.onAuthStateChanged(user=>{
    if(!user){
      if(invite){
        AUTH.status='invite';AUTH._inviteCode=invite;
        fbDb.collection('invites').doc(invite).get().then(snap=>{
          if(snap.exists&&!snap.data().used){AUTH._inviteClientName=snap.data().clientName;AUTH._inviteEmail=snap.data().email||'';}
          else{AUTH.err='This invite link is no longer valid.';}
          render();
        });
      }else{AUTH.status='login';render();}
      return;
    }
    AUTH.uid=user.uid;
    fetchUserDocWithRetry(user.uid,0);
  });
}

function vDash(){
  var tc=S.cls.length;
  var tp=Object.values(S.progs).reduce(function(a,p){return a+p.length;},0);
  // This-week workouts from progressLog
  var weekAgo=Date.now()-7*24*60*60*1000;
  var weekLogs=[];Object.keys(S.progressLog).forEach(function(k){(S.progressLog[k]||[]).forEach(function(l){if(l.date>weekAgo)weekLogs.push(l);});});
  // Avg completion rate
  var allLogs=[];Object.keys(S.progressLog).forEach(function(k){(S.progressLog[k]||[]).forEach(function(l){allLogs.push(l);});});
  var avgPct=allLogs.length?Math.round(allLogs.reduce(function(a,l){return a+l.pct;},0)/allLogs.length)+'%':'—';
  var stats=[{l:'Total Clients',v:tc||0},{l:'Active Programs',v:tp||0},{l:'Sessions This Week',v:weekLogs.length},{l:'Avg Completion',v:avgPct}];
  var sc=stats.map(function(s){return'<div class="stat-box"><div class="stat-box-label">'+s.l+'</div><div class="stat-box-val">'+s.v+'</div></div>';}).join('');
  // Recent activity: real logs + any programs
  var act=[];
  allLogs.sort(function(a,b){return b.date-a.date;}).slice(0,10).forEach(function(log){
    var key=Object.keys(S.progressLog).find(function(k){return(S.progressLog[k]||[]).includes(log);});
    if(!key)return;
    var parts=key.split('_');var cid=parts[0];var pid=parts.slice(1).join('_');
    var cl=S.cls.find(function(c){return c.id===cid;});
    var pr=null;(S.progs[cid]||[]).forEach(function(p){if(p.id===pid)pr=p;});
    var dt=new Date(log.date);var now=new Date();
    var diffD=Math.floor((now-dt)/(1000*60*60*24));
    var dtStr=diffD===0?'Today':diffD===1?'Yesterday':diffD+' days ago';
    act.push({cl:cl?cl.name:'Unknown',ac:'Workout ('+log.pct+'%)',pr:pr?pr.name:log.sessName,dt:dtStr,st:log.pct>=100?'ok':'ip'});
  });
  if(!act.length&&S.cls.length){S.cls.slice(0,4).forEach(function(cl){(S.progs[cl.id]||[]).forEach(function(p){act.push({cl:cl.name,ac:'Program Created',pr:p.name,dt:'Recently',st:'ip'});});});}
  if(!act.length)act=[{cl:'No data yet',ac:'Complete a workout to see activity',pr:'—',dt:'—',st:'ip'}];
  var rows=act.slice(0,6).map(function(r){
    var b=r.st==='ok'?'<span class="sbadge sb-ok">&#10003; Complete</span>':'<span class="sbadge sb-ip">In Progress</span>';
    return'<tr><td>'+es(r.cl)+'</td><td>'+es(r.ac)+'</td><td>'+es(r.pr)+'</td><td>'+es(r.dt)+'</td><td>'+b+'</td></tr>';
  }).join('');
  return'<div class="main">'
    +'<div class="pg-hdr" style="margin-bottom:24px;"><div>'
    +'<div style="font-family:var(--fd);font-size:40px;letter-spacing:.02em;margin-bottom:4px;">Dashboard</div>'
    +'<div class="pg-sub">Welcome back! Here\'s your coaching overview.</div>'
    +'</div><div style="display:flex;gap:8px"><button class="btn bg bsm" onclick="navTo(\'templates\')">&#9632; Templates</button><button class="btn bg bsm" onclick="navTo(\'progress\')">&#9656; Progress</button></div></div>'
    +'<div class="dash-stats">'+sc+'</div>'
    +'<div class="dash-table-wrap">'
    +'<div class="dash-table-hdr"><div class="dash-table-title">Recent Activity</div></div>'
    +'<table class="dtable"><thead><tr><th>Client</th><th>Activity</th><th>Program</th><th>Date</th><th>Status</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'</div></div>';
}

/* ── WORKOUT MODE ── */
function startWorkout(sessIdx){
  const prog=S.ep||curpr();
  if(!prog){alert('Open a program first.');return;}
  S.ep=JSON.parse(JSON.stringify(prog));
  S.wk.si=sessIdx;
  S.wk.checked=[];
  S.wk.startTime=Date.now();
  S.wk.timerSecs=0;
  if(S.wk.timerInt)clearInterval(S.wk.timerInt);
  S.wk.timerInt=null;
  navTo('workout',{cid:S.cid,pid:S.pid});
}

function vWorkout(){
  const prog=S.ep||curpr();
  if(!prog)return'<div class="wk-wrap"><div class="empty"><div class="et2">NO PROGRAM</div></div></div>';
  const sess=prog.sessions?.[S.wk.si];
  if(!sess)return'<div class="wk-wrap"><div class="empty"><div class="et2">NO SESSION</div></div></div>';
  const exs=sess.exercises||[];
  const done=S.wk.checked.length;
  const total=exs.length;
  const pct=total?Math.round((done/total)*100):0;
  const elapsed=S.wk.startTime?Math.floor((Date.now()-S.wk.startTime)/1000):0;
  const elMin=Math.floor(elapsed/60).toString().padStart(2,'0');
  const elSec=(elapsed%60).toString().padStart(2,'0');

  if(done===total&&total>0){
    return'<div class="wk-wrap"><div class="wk-done"><div class="wk-done-icon">🏆</div><div class="wk-done-title">SESSION COMPLETE!</div><div class="wk-done-sub">'+es(sess.name||sess.day).toUpperCase()+' — WELL DONE</div><div class="wk-done-stats"><div class="wk-done-stat"><div class="wk-done-stat-num">'+total+'</div><div class="wk-done-stat-label">Exercises Done</div></div><div class="wk-done-stat"><div class="wk-done-stat-num">'+elMin+':'+elSec+'</div><div class="wk-done-stat-label">Total Time</div></div></div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn bg" onclick="endWorkout()">Back to Program</button><button class="btn bp" onclick="restartWk()">Restart Session</button></div></div></div>';
  }

  const exRows=exs.map((ex,i)=>{
    const isDone=S.wk.checked.includes(i);
    const def=allEx().find(e=>e.id===ex.exerciseId)||{};
    var rpeDisp=ex.rpe?'<span style="background:rgba(251,54,64,.15);color:#FB3640;padding:1px 7px;font-size:10px;font-weight:700;font-family:var(--fm)">RPE '+es(ex.rpe)+'</span>':'';
    return'<div class="wk-ex'+(isDone?' done':'')+'" onclick="toggleCheck('+i+')" id="wk-ex-'+i+'"><div class="wk-check">'+(isDone?'✓':'')+'</div><div class="wk-ex-info"><div class="wk-ex-name">'+es(ex.name)+'</div><div class="wk-ex-detail"><span>'+es(ex.sets)+' sets</span><span>'+es(ex.reps)+' reps</span><span style="color:var(--th)">Rest: '+es(ex.rest)+'</span>'+rpeDisp+'</div></div><div class="wk-ex-num">'+(i+1)+'</div></div>';
  }).join('');

  return'<div class="wk-wrap"><div class="wk-header"><div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><div class="wk-subtitle">OXYN FITNESS — Workout Mode</div><div class="wk-title">'+es(sess.day).toUpperCase()+'</div><div class="wk-subtitle" style="color:var(--orange)">'+es(sess.name||'Session').toUpperCase()+'</div></div><div style="text-align:right"><div style="font-family:var(--fd);font-size:28px;color:var(--orange);letter-spacing:.04em" id="wk-elapsed">'+elMin+':'+elSec+'</div><div style="font-family:var(--fm);font-size:9px;color:var(--th);letter-spacing:.08em;text-transform:uppercase">Elapsed</div></div></div><div class="wk-progress-wrap"><div class="wk-progress-bar"><div class="wk-progress-fill" style="width:'+pct+'%"></div></div><div class="wk-progress-label"><span>'+done+' of '+total+' exercises complete</span><span>'+pct+'%</span></div></div></div><div class="wk-timer" id="wk-timer"><div class="wk-timer-icon">⏱</div><div><div class="wk-timer-label">Rest Timer</div><div class="wk-timer-val" id="wk-timer-val">0:00</div></div><button class="wk-timer-skip" onclick="skipTimer()">Skip Rest</button></div><div class="wk-ex-list">'+exRows+'</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn bg" onclick="endWorkout()">End Session</button><button class="btn bp" onclick="resetChecks()">Reset Checklist</button></div></div>';
}

function toggleCheck(idx){
  const prog=S.ep||curpr();
  const sess=prog?.sessions?.[S.wk.si];
  if(!sess)return;
  const i=S.wk.checked.indexOf(idx);
  if(i>=0){S.wk.checked.splice(i,1);stopTimer();}
  else{
    S.wk.checked.push(idx);
    const ex=sess.exercises?.[idx];
    if(ex?.rest&&ex.rest!=='none'){startRestTimer(ex.rest);}
  }
  render();
  // Scroll to next unchecked
  setTimeout(()=>{
    const done=S.wk.checked.length;
    const total=sess.exercises?.length||0;
    if(done<total){
      const allEls=document.querySelectorAll('.wk-ex');
      for(let el of allEls){if(!el.classList.contains('done')){el.scrollIntoView({behavior:'smooth',block:'center'});break;}}
    }
  },200);
}

function startRestTimer(restStr){
  stopTimer();
  let secs=120;
  const m=restStr.match(/(\d+)\s*min/i);
  const s=restStr.match(/(\d+)\s*sec/i);
  if(m)secs=parseInt(m[1])*60;
  else if(s)secs=parseInt(s[1]);
  S.wk.timerSecs=secs;
  const el=document.getElementById('wk-timer');
  const val=document.getElementById('wk-timer-val');
  const elapsed=document.getElementById('wk-elapsed');
  if(el)el.classList.add('active');
  S.wk.timerInt=setInterval(()=>{
    S.wk.timerSecs--;
    if(val){const m=Math.floor(S.wk.timerSecs/60);const s=S.wk.timerSecs%60;val.textContent=m+':'+(s<10?'0':'')+s;}
    if(elapsed&&S.wk.startTime){const elapsed_e=Math.floor((Date.now()-S.wk.startTime)/1000);const elapsed_m=Math.floor(elapsed_e/60);const elapsed_s=elapsed_e%60;elapsed.textContent=(elapsed_m<10?'0':'')+elapsed_m+':'+(elapsed_s<10?'0':'')+elapsed_s;}
    if(S.wk.timerSecs<=0){stopTimer();const el2=document.getElementById('wk-timer');if(el2)el2.classList.remove('active');}
  },1000);
}

function stopTimer(){if(S.wk.timerInt){clearInterval(S.wk.timerInt);S.wk.timerInt=null;}}
function skipTimer(){stopTimer();const el=document.getElementById('wk-timer');if(el)el.classList.remove('active');}
function resetChecks(){S.wk.checked=[];stopTimer();render();}
function restartWk(){S.wk.checked=[];S.wk.startTime=Date.now();stopTimer();render();}
function endWorkout(){
  const prog=S.ep||curpr();
  const sess=prog?.sessions?.[S.wk.si];
  const done=S.wk.checked.length;
  const total=sess?.exercises?.length||0;
  if(FB_CONFIGURED&&AUTH.role==='client'){
    if(done>0){
      const elapsed=S.wk.startTime?Math.floor((Date.now()-S.wk.startTime)/1000):0;
      submitClientLog(S.pid,{date:Date.now(),sessName:sess?.name||sess?.day||'Session',done,total,elapsed,pct:total?Math.round((done/total)*100):0});
      toast('Workout logged — nice work!','🏆');
    }
    stopTimer();navTo('dashboard');
    return;
  }
  if(done>0&&S.cid&&S.pid){
    const elapsed=S.wk.startTime?Math.floor((Date.now()-S.wk.startTime)/1000):0;
    const key=S.cid+'_'+S.pid;
    if(!S.progressLog[key])S.progressLog[key]=[];
    S.progressLog[key].push({date:Date.now(),sessName:sess?.name||sess?.day||'Session',done,total,elapsed,pct:total?Math.round((done/total)*100):0});
    sv();
  }
  stopTimer();navTo('program-view',{cid:S.cid,pid:S.pid});
}

/* ── DRAG & DROP EXERCISES ── */
function onDragStart(e,idx){
  _dragIdx=idx;_dragSi=S.si;
  e.dataTransfer.effectAllowed='move';
  e.currentTarget.classList.add('dragging');
}
function onDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.er.drag-over').forEach(el=>el.classList.remove('drag-over'));
}
function onDragOver(e,idx){
  e.preventDefault();e.dataTransfer.dropEffect='move';
  if(_dragIdx===null||_dragIdx===idx)return;
  document.querySelectorAll('.er.drag-over').forEach(el=>el.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function onDrop(e,targetIdx){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(_dragIdx===null||_dragIdx===targetIdx)return;
  const sess=S.ep?.sessions[S.si];if(!sess?.exercises)return;
  snap();
  const exs=sess.exercises;
  const moved=exs.splice(_dragIdx,1)[0];
  exs.splice(targetIdx,0,moved);
  _dragIdx=null;
  scheduleAutosave();
  rET();
}

/* ── PROGRAM CRUD ── */
function svPr(){const pr=S.ep;if(!pr||!S.cid)return;if(!S.progs[S.cid])S.progs[S.cid]=[];const list=S.progs[S.cid];const idx=list.findIndex(p=>p.id===pr.id);const cpy=JSON.parse(JSON.stringify(pr));if(idx>=0)list[idx]=cpy;else list.push(cpy);S.pid=pr.id;sv();toast('Program saved');}
function pvPr(){svPr();S.pid=S.ep?.id;navTo('program-view',{cid:S.cid});}
function dlPr(pid){if(!confirm('Delete this program?'))return;S.progs[S.cid]=(S.progs[S.cid]||[]).filter(p=>p.id!==pid);sv();render();toast('Deleted','🗑');}

function doClonePr(){
  const pid=document.getElementById('clone-src-pid').value;
  const name=document.getElementById('clone-nm').value.trim();
  const targetCid=document.getElementById('clone-cid').value;
  if(!name){document.getElementById('clone-nm').style.borderColor='var(--rd)';return;}
  const src=(S.progs[S.cid]||[]).find(p=>p.id===pid)||(S.ep&&S.ep.id===pid?S.ep:null);
  if(!src){clM();return;}
  const cpy=JSON.parse(JSON.stringify(src));
  cpy.id=uid();
  cpy.name=name;
  cpy.cid=targetCid;
  cpy.created=Date.now();
  (cpy.sessions||[]).forEach(function(s){s.id=uid();(s.exercises||[]).forEach(function(ex){ex.id=uid();});});
  if(!S.progs[targetCid])S.progs[targetCid]=[];
  S.progs[targetCid].push(cpy);
  sv();clM();
  const targetName=(S.cls.find(c=>c.id===targetCid)||{}).name||'client';
  toast('Cloned to '+targetName,'⧉');
  if(targetCid===S.cid){render();}
  else{navTo('client-detail',{cid:targetCid});}
}
function opPr(pid){const pr=(S.progs[S.cid]||[]).find(p=>p.id===pid);if(!pr)return;S.ep=JSON.parse(JSON.stringify(pr));S.pid=pid;S.si=0;S._undo=[];navTo('program-builder');}
function vwPr(pid){const pr=(S.progs[S.cid]||[]).find(p=>p.id===pid);if(!pr)return;S.ep=JSON.parse(JSON.stringify(pr));S.pid=pid;navTo('program-view');}

/* ── AUTOSAVE + UNDO ── */
function snap(){
  if(!S.ep)return;
  S._undo.push(JSON.parse(JSON.stringify(S.ep)));
  if(S._undo.length>20)S._undo.shift();
  updateUndoBtn();
}
function updateUndoBtn(){
  const b=document.getElementById('undo-btn');
  if(b)b.disabled=!S._undo.length;
}
function setAsBadge(state){
  S._asState=state;
  const b=document.getElementById('autosave-badge');
  if(!b)return;
  b.className='autosave-badge '+state;
  b.innerHTML='<span class="as-dot"></span>'+(state==='saving'?'Saving…':'All changes saved');
}
function scheduleAutosave(){
  setAsBadge('saving');
  if(S._asTimer)clearTimeout(S._asTimer);
  S._asTimer=setTimeout(commitAutosave,500);
}
function commitAutosave(){
  if(S._asTimer){clearTimeout(S._asTimer);S._asTimer=null;}
  if(!S.ep||!S.cid)return;
  if(!S.progs[S.cid])S.progs[S.cid]=[];
  const list=S.progs[S.cid];
  const idx=list.findIndex(p=>p.id===S.ep.id);
  const cpy=JSON.parse(JSON.stringify(S.ep));
  if(idx>=0)list[idx]=cpy;else list.push(cpy);
  S.pid=S.ep.id;
  sv();
  setAsBadge('saved');
}
function undoEp(){
  if(!S._undo.length){toast('Nothing to undo','↺');return;}
  S.ep=S._undo.pop();
  if(S.si>=(S.ep.sessions||[]).length)S.si=Math.max(0,(S.ep.sessions||[]).length-1);
  updateUndoBtn();
  commitAutosave();
  render();
  toast('Undone','↺');
}
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&S.v==='program-builder'){
    e.preventDefault();undoEp();
  }
});

function useTemplate(tid){
  var t=TEMPLATES.find(function(x){return x.id===tid;});if(!t)return;
  var cl=document.getElementById('tpl-cl');
  var cid=cl?cl.value:null;
  if(!cid){alert('Select a client first.');return;}
  var sessions=t.sessions.map(function(s){
    return{id:uid(),day:s.day,name:s.name,exercises:(s.exercises||[]).map(function(e){return Object.assign({id:uid()},e);})};
  });
  var prog={id:uid(),cid:cid,name:t.name,weeks:t.weeks,focus:t.focus,notes:t.desc,created:Date.now(),sessions:sessions};
  if(!S.progs[cid])S.progs[cid]=[];
  S.progs[cid].push(prog);
  S.cid=cid;S.pid=prog.id;S.ep=JSON.parse(JSON.stringify(prog));S.si=0;
  sv();clM();
  navTo('program-view',{cid:cid,pid:prog.id});
  toast('Template applied — '+t.name,'✦');
}

function vProgress(){
  var allLogs=[];
  Object.keys(S.progressLog).forEach(function(key){
    var parts=key.split('_');var cid=parts[0];var pid=parts.slice(1).join('_');
    var cl=S.cls.find(function(c){return c.id===cid;});
    var pr=null;(S.progs[cid]||[]).forEach(function(p){if(p.id===pid)pr=p;});
    (S.progressLog[key]||[]).forEach(function(log){
      allLogs.push({cid,pid,clName:cl?cl.name:'Unknown',prName:pr?pr.name:'Unknown',log});
    });
  });
  allLogs.sort(function(a,b){return b.log.date-a.log.date;});

  if(!allLogs.length){
    return'<div class="main"><div class="pg-hdr"><div><div class="sec-label">OXYN FITNESS</div><div class="pg-title">CLIENT <span>PROGRESS</span></div><div class="pg-sub">Workout completion history across all clients.</div></div></div>'
      +'<div class="empty"><div class="ei2">📈</div><div class="et2">NO SESSIONS LOGGED YET</div><div class="ed">Complete a workout via the Workout Mode to see progress here.</div></div></div>';
  }

  // Group by client
  var byClient={};
  allLogs.forEach(function(item){
    if(!byClient[item.cid])byClient[item.cid]={clName:item.clName,entries:[]};
    byClient[item.cid].entries.push(item);
  });

  var clientSections=Object.keys(byClient).map(function(cid){
    var data=byClient[cid];
    var entries=data.entries.slice(0,10);
    var totalDone=data.entries.reduce(function(a,i){return a+i.log.done;},0);
    var totalEx=data.entries.reduce(function(a,i){return a+i.log.total;},0);
    var avgPct=totalEx?Math.round((totalDone/totalEx)*100):0;
    var totalTime=data.entries.reduce(function(a,i){return a+i.log.elapsed;},0);
    var totalMin=Math.round(totalTime/60);

    // Mini bar chart — last 7 sessions pct
    var chartData=data.entries.slice(0,7).reverse();
    var chartH=chartData.map(function(item){
      var h=Math.max(4,Math.round((item.log.pct/100)*56));
      var dt=new Date(item.log.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
      return'<div class="progress-bar-v" style="height:'+h+'px"><div class="pb-tip">'+dt+'<br>'+item.log.pct+'%</div></div>';
    }).join('');

    var rows=entries.map(function(item){
      var dt=new Date(item.log.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
      var tm=item.log.elapsed?Math.floor(item.log.elapsed/60)+'m':'—';
      var pct=item.log.pct;
      var col=pct>=100?'#10b981':pct>=75?'#f59e0b':'#FB3640';
      return'<tr><td style="padding:10px 16px;font-size:13px">'+es(dt)+'</td>'
        +'<td style="padding:10px 16px;font-size:12px;color:var(--tm)">'+es(item.prName)+' — '+es(item.log.sessName)+'</td>'
        +'<td style="padding:10px 16px;text-align:center"><span style="background:rgba(251,54,64,.1);color:'+col+';padding:2px 8px;font-size:11px;font-weight:700;font-family:var(--fm)">'+pct+'%</span></td>'
        +'<td style="padding:10px 16px;text-align:center;font-family:var(--fm);font-size:11px;color:var(--tm)">'+tm+'</td>'
        +'</tr>';
    }).join('');

    return'<div style="margin-bottom:28px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px">'
      +'<div style="display:flex;align-items:center;gap:12px"><div class="cav '+avc(data.clName)+'" style="width:36px;height:36px;font-size:15px;flex-shrink:0">'+ini(data.clName)+'</div><div><div style="font-family:var(--fd);font-size:20px;letter-spacing:.04em">'+es(data.clName).toUpperCase()+'</div><div style="font-size:10px;color:var(--tm);font-family:var(--fm);margin-top:2px">'+data.entries.length+' SESSIONS LOGGED</div></div></div>'
      +'<div style="display:flex;gap:14px">'
      +'<div style="text-align:center"><div style="font-family:var(--fd);font-size:22px;color:var(--orange)">'+avgPct+'%</div><div style="font-size:9px;font-family:var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--tm)">Avg Completion</div></div>'
      +'<div style="text-align:center"><div style="font-family:var(--fd);font-size:22px;color:var(--orange)">'+totalMin+'</div><div style="font-size:9px;font-family:var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--tm)">Total Minutes</div></div>'
      +'</div></div>'
      +(chartData.length>1?'<div style="background:var(--surface);border:1px solid var(--border);padding:14px 16px;margin-bottom:12px"><div style="font-size:9px;font-family:var(--fm);letter-spacing:.1em;color:var(--th);text-transform:uppercase;margin-bottom:8px">Completion % — Last '+chartData.length+' Sessions</div><div class="progress-chart">'+chartH+'</div></div>':'')
      +'<div class="dash-table-wrap"><table class="dtable"><thead><tr><th>Date</th><th>Session</th><th style="text-align:center">Completion</th><th style="text-align:center">Duration</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      +'</div>';
  }).join('');

  return'<div class="main"><div class="pg-hdr"><div><div class="sec-label">OXYN FITNESS</div><div class="pg-title">CLIENT <span>PROGRESS</span></div><div class="pg-sub">Workout completion history across all clients.</div></div>'
    +'<button class="btn bd bsm" onclick="if(confirm(\'Clear all progress logs?\'))clearProgress()">Clear All Logs</button></div>'
    +clientSections+'</div>';
}

  var ex=exs[ei];if(!ex||!ex.groupId)return null;

  (sess.exercises||[]).forEach(function(e){if(e.groupId&&!seen[e.groupId]){seen[e.groupId]=true;gmap[e.groupId]=(sess.exercises||[]).filter(function(x){return x.groupId===e.groupId;});}});

  tH+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">';
  ['drop-set','pyramid','rest-pause'].forEach(function(t){
    var a=ex.sysType===t;
    tH+='<button id="gbt-'+t+'" class="btn bg bsm" style="font-size:11px;'+(a?'border-color:'+GRP_COL[t]+';color:'+GRP_COL[t]+';background:rgba('+rgb(GRP_COL[t])+',.1);':'')+'\" data-t="'+t+'" onclick="selSys(this.dataset.t)"><span style="background:'+GRP_COL[t]+';color:'+(t==='pyramid'?'#000':'#fff')+';padding:1px 5px;margin-right:4px;font-size:9px">'+GRP_LBL[t]+'</span>'+t.replace('-',' ').toUpperCase()+'</button>';
  });
  tH+='</div>';
  var descTxt=ex.sysType?SYS_DESC[ex.sysType]:'Select a system to see description.';
  tH+='<div id="sys-desc" style="font-size:11px;color:var(--tm);line-height:1.6;padding:8px 12px;background:var(--surface-2);border-left:2px solid var(--border-med);margin-bottom:16px">'+descTxt+'</div>';
  var eH='';
  if(gkeys.length){
    eH='<div style="font-size:11px;letter-spacing:.1em;color:var(--th);margin-bottom:8px;font-weight:700">ADD TO EXISTING GROUP</div>';
    gkeys.forEach(function(gid){
      var gexs=gmap[gid],t=gexs[0].groupType||'superset',a=ex.groupId===gid;
      eH+='<div id="go-'+gid+'" style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#1a1a1a;border-radius:6px;margin-bottom:6px;cursor:pointer;border:2px solid '+(a?GRP_COL[t]:'transparent')+'" onclick="selGG(this)">'
        +'<input type="hidden" value="'+gid+'"><input type="hidden" value="'+t+'">'
        +'<span style="background:'+GRP_COL[t]+';color:#fff;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700">'+GRP_LBL[t]+'</span>'
        +'<span style="font-size:12px">'+gexs.map(function(e){return es(e.name);}).join(', ')+'</span></div>';
    });
  }
  var clearBtns='';
  if(ex.groupId)clearBtns+='<button class="btn bg" style="color:#e55;border-color:#e55;margin-bottom:8px;width:100%" onclick="rmGrp('+ei+')">✕ Remove from Group</button>';
  if(ex.sysType)clearBtns+='<button class="btn bg" style="color:#e55;border-color:#e55;margin-bottom:8px;width:100%" onclick="rmSys('+ei+')">✕ Remove System Tag</button>';
  MR().innerHTML='<div class="mo" onclick="if(event.target===this)clM()"><div class="md" style="max-width:460px"><div class="mdt">TRAINING SYSTEM</div><div style="font-size:12px;color:var(--th);margin-bottom:16px">Exercise: <strong>'+es(ex.name)+'</strong></div>'+tH+eH+clearBtns+'<div class="mdf"><button class="btn bg" onclick="clM()">Cancel</button><button class="btn bp" onclick="doGrp(false)">New Group</button>'+(gkeys.length?'<button class="btn" style="background:#FB3640;color:#fff" onclick="doGrp(true)">Add to Selected</button>':'')+'</div></div></div>';
}
function selGT(t){
  window._gtype=t;
  ['superset','triset','circuit','phr','drop-set','pyramid','rest-pause'].forEach(function(x){var b=document.getElementById('gbt-'+x);if(b){b.style.borderColor='';b.style.color='';b.style.background='';}});
  var b=document.getElementById('gbt-'+t);if(b){b.style.borderColor=GRP_COL[t];b.style.color=GRP_COL[t];b.style.background='rgba('+rgb(GRP_COL[t])+',.1)';}
}
function selSys(t){
  window._gtype=t;window._sysOnly=true;
  ['superset','triset','circuit','phr','drop-set','pyramid','rest-pause'].forEach(function(x){var b=document.getElementById('gbt-'+x);if(b){b.style.borderColor='';b.style.color='';b.style.background='';}});
  var b=document.getElementById('gbt-'+t);if(b){b.style.borderColor=GRP_COL[t];b.style.color=GRP_COL[t];b.style.background='rgba('+rgb(GRP_COL[t])+',.1)';}
  var dd=document.getElementById('sys-desc');if(dd)dd.textContent=SYS_DESC[t]||'';
  // Apply immediately on click
  var sess=S.ep&&S.ep.sessions[S.si];if(!sess)return;
  var ex=sess.exercises[window._gei];if(!ex)return;
  snap();
  ex.sysType=t;
  scheduleAutosave();
  rET();toast(t.replace('-',' ').toUpperCase()+' applied','✦');
}
function selGG(el){
  var inputs=el.querySelectorAll('input');
  window._ggid=inputs[0].value;window._gtype=inputs[1].value;
  document.querySelectorAll('[id^="go-"]').forEach(function(e){e.style.borderColor='transparent';});
  el.style.borderColor=GRP_COL[window._gtype];
}
function doGrp(useExisting){
  var sess=S.ep&&S.ep.sessions[S.si];if(!sess)return;
  var ex=sess.exercises[window._gei];if(!ex)return;
  snap();
  ex.groupId=(useExisting&&window._ggid)?window._ggid:uid();
  ex.groupType=window._gtype||'superset';
  scheduleAutosave();
  clM();rET();toast('Grouped','✦');
}
function rmGrp(ei){
  var sess=S.ep&&S.ep.sessions[S.si];if(!sess)return;
  var ex=sess.exercises[ei];if(!ex)return;
  snap();
  var gid=ex.groupId;delete ex.groupId;delete ex.groupType;
  var left=(sess.exercises||[]).filter(function(e){return e.groupId===gid;});
  if(left.length===1){delete left[0].groupId;delete left[0].groupType;}
  scheduleAutosave();
  clM();rET();toast('Ungrouped','');
}
function rmSys(ei){
  var sess=S.ep&&S.ep.sessions[S.si];if(!sess)return;
  var ex=sess.exercises[ei];if(!ex)return;
  snap();
  delete ex.sysType;
  scheduleAutosave();
  clM();rET();toast('System removed','');
}

</script>
</body>
</html>
